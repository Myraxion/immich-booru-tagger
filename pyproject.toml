[project]
name = "immich-booru-tagger"
version = "0.1.0"
description = "Stateless local automated Booru tagging CLI tool for Immich."
readme = "DESIGN.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
cpu = [
    "dghs-imgutils",
    "dghs-realutils",
    "onnxruntime",
]
gpu = [
    "dghs-imgutils",
    "dghs-realutils",
    "onnxruntime-gpu",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pytest>=8.0.0",
]

[project.scripts]
immich-booru-tagger = "immich_booru_tagger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/immich_booru_tagger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
mypy_path = "src"
packages = ["immich_booru_tagger"]
